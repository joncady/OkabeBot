name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OKABEBOT_CONFIG: examples/single-pi.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,notifications,cast]'
      - run: python scripts/check-amadeus-privacy.py --tracked
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: node --check okabebot/web/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check okabebot/web/tv.js
      - run: node --check okabebot/web/lab-room.js
      - run: node --test tests/web-*.test.cjs
      - run: bash -n scripts/start-linux.sh
      - run: python -m build
      - run: python scripts/check-release.py dist
