# Silent schedule cards for Alexa Devices; no alarm/completion inference.
# Requires the same publish-only notification secrets as okabebot.yaml.
# Discovers imported Alexa timer/reminder sensors; no personal entity IDs.
rest_command:
  okabebot_alexa_notification:
    url: !secret okabebot_notification_url
    method: POST
    content_type: application/json
    headers:
      X-Notification-Token: !secret okabebot_notification_token
    payload: >-
      {{ {"source": "alexa", "title": title, "body": body,
          "priority": "normal", "audio": "silent", "dedupe_key": event_key,
          "expires_at": as_timestamp(now()) + 120} | to_json }}
    timeout: 10

automation:
  - id: okabebot_alexa_schedule_cards
    alias: OkabeBot - Alexa timer and reminder cards
    description: Imported future schedules only; silent and deduplicated by sensor/due time.
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set e = trigger.event.data %}
          {% set id = e.entity_id | default('') %}
          {% set old = e.old_state | default(none) %}
          {% set new = e.new_state | default(none) %}
          {{ id.startswith('sensor.')
             and id.endswith(('_next_timer', '_next_reminder'))
             and id in integration_entities('alexa_devices')
             and old is not none and new is not none
             and old.state != new.state
             and as_timestamp(new.state, 0) > as_timestamp(now()) }}
    actions:
      - variables:
          schedule_entity: "{{ trigger.event.data.entity_id }}"
          schedule_due: "{{ as_timestamp(trigger.event.data.new_state.state, 0) | int }}"
          schedule_kind: "{{ 'Timer' if schedule_entity.endswith('_next_timer') else 'Reminder' }}"
          schedule_device: >-
            {{ device_attr(schedule_entity, 'name_by_user')
               or device_attr(schedule_entity, 'name') or 'Alexa' }}
      - action: rest_command.okabebot_alexa_notification
        data:
          title: "Alexa {{ schedule_kind | lower }} scheduled"
          body: >-
            {{ schedule_device }} · {{ schedule_kind }} at
            {{ schedule_due | timestamp_custom('%I:%M %p', true) }}.
          event_key: "alexa-schedule-{{ schedule_entity }}-{{ schedule_due }}"
    mode: queued
    max: 30
    max_exceeded: warning
