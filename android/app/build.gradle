plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'dev.okabebot.amadeus'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.okabebot.amadeus'
        minSdk 28
        targetSdk 36
        versionCode providers.gradleProperty('appVersionCode').getOrElse('8').toInteger()
        versionName '0.1.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets.androidTest.assets.srcDir rootProject.file('../okabebot/web')
    signingConfigs {
        release {
            if (System.getenv('AMADEUS_KEYSTORE')) {
                storeFile file(System.getenv('AMADEUS_KEYSTORE'))
                storePassword System.getenv('AMADEUS_STORE_PASSWORD')
                keyAlias 'amadeus'
                keyPassword System.getenv('AMADEUS_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
