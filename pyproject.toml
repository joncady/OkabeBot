[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okabebot-hardware-lab"
version = "0.1.0"
description = "A configurable Codex voice companion with an expressive face and MCP hardware tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.20,<2", "Pillow>=10,<13", "jsonschema>=4,<5"]

[project.optional-dependencies]
mobile = ["firebase-admin>=7,<8"]
vision = ["opencv-python-headless>=4.10,<5"]
home-assistant = ["paho-mqtt>=2,<3", "aiohttp>=3.10,<4"]
cast = ["PyChromecast>=13.1,<14; python_version < '3.11'", "PyChromecast>=14,<15; python_version >= '3.11'"]
sonos = ["sonos-websocket==0.2.0"]
alexa-prototype = ["imageio-ffmpeg==0.6.0"]
alexa-destination = ["boto3[crt]>=1.40,<2"]
alexa-conversation = ["boto3[crt]>=1.40,<2", "imageio-ffmpeg==0.6.0"]
voice = ["faster-whisper==1.2.1", "av==16.1.0"]
notifications = ["icalendar>=6,<7", "recurring-ical-events>=3,<4"]
dev = ["ruff>=0.9", "build", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.scripts]
okabebot = "okabebot.bridge:main"
okabebot-mcp = "okabebot.server:main"
okabebot-model = "okabebot.setup:download_model"
okabebot-doctor = "okabebot.doctor:main"

[tool.setuptools.packages.find]
include = ["okabebot*"]

[tool.setuptools.package-data]
okabebot = ["assets/*", "web/*", "prompts/*.md", "characters/*/*.json", "characters/*/*.md", "characters/*/*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
