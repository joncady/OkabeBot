[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okabebot-hardware-lab"
version = "0.1.0"
description = "A configurable Codex voice companion with an expressive face and MCP hardware tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.20,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
cast = ["PyChromecast>=14,<15"]
voice = ["faster-whisper==1.2.1", "av==16.1.0"]
notifications = ["icalendar>=6,<7", "recurring-ical-events>=3,<4"]
dev = ["ruff>=0.9", "build", "PyYAML>=6,<7"]

[project.scripts]
okabebot = "okabebot.bridge:main"
okabebot-mcp = "okabebot.server:main"
okabebot-model = "okabebot.setup:download_model"
okabebot-doctor = "okabebot.doctor:main"

[tool.setuptools.packages.find]
include = ["okabebot*"]

[tool.setuptools.package-data]
okabebot = ["assets/*", "web/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
