<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion screen</title><link rel="stylesheet" href="/companion.css"><link rel="stylesheet" href="/surface-theme.css"></head><body><svg class="sprite" aria-hidden="true"><defs><symbol id="i-call" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 14h4v-4h4V6h4v4h4v4h-4v4h-4v-4H8v4H4z"/></symbol><symbol id="i-mic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10 3h4v12h-4zM6 10h2v7h8v-7h2v9h-5v2h3v2H8v-2h3v-2H6z"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 11h3V8h3V5h6v3h3v3h3v3h-3v7h-5v-6h-2v6H6v-7H3z"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M9 2h6v3h3v3h3v8h-3v3h-3v3H9v-3H6v-3H3V8h3V5h3zM9 9v6h6V9z"/></symbol><symbol id="i-pip" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 4h18v16H3zM5 6v12h14V6zM11 11h6v5h-6z"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5 3l7 7 7-7 2 2-7 7 7 7-2 2-7-7-7 7-2-2 7-7-7-7z"/></symbol><symbol id="i-sound" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 9h4l6-5v16l-6-5H3zM16 7h2v3h2v4h-2v3h-2v-3h2v-4h-2z"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 9h4V5h7v3H8v3H6v5h5v-2h3v5H3zM10 5h11v11h-5v-3h2V8h-5v2h-3z"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6 3h12v3h3v12h-3v3H6v-3H3V6h3zM7 7v10h10V7zM10 8h2v4h4v2h-6z"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 11h4v4h3v-4h3V7h3V3h5v5h-3v4h-3v4h-3v5H7v-3H3z"/></symbol><symbol id="i-warn" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10 2h4v4h3v5h3v5h2v5H2v-5h2v-5h3V6h3zM11 8v7h2V8zM11 17v2h2v-2z"/></symbol></defs></svg>
<main><div class="stage"><canvas id="character" width="320" height="320" aria-label="Companion character"></canvas><span id="state-icon" class="state-icon" role="img" aria-label="Connecting"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-link"/></svg></span></div>
<section class="hud" aria-label="Companion controls"><h1 id="device-name" class="sr-only">This screen</h1><p id="status" class="sr-only" role="status">Connecting…</p><p id="notice" class="sr-only" role="status"></p><div class="controls"><span id="drag-space" aria-hidden="true"></span><button id="summon" type="button" aria-label="Call companion here" title="Call companion here" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-call"/></svg></button><button id="mic" type="button" aria-label="Hold to talk" title="Hold to talk" disabled aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-mic"/></svg></button><button id="return" type="button" aria-label="Return companion" title="Return companion" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-home"/></svg></button><button id="pip" type="button" aria-label="Picture in picture" title="Picture in picture" ><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-pip"/></svg></button><button id="settings" type="button" aria-label="Companion settings" title="Companion settings" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-settings"/></svg></button><button id="native-close" type="button" aria-label="Close companion" title="Close companion" ><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div></section>
<section id="setup" class="pixel-panel" aria-label="Companion setup"><button id="setup-close" type="button" aria-label="Close companion" title="Close companion"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-close"/></svg></button><h2 id="setup-title">A little setup</h2><p id="setup-description">Connect this screen, then enable sound and microphone once.</p><ul class="setup-steps"><li id="pair-step">Waiting for dashboard approval</li><li id="sound-step">Sound needs a tap</li><li id="mic-step">Microphone needs permission</li></ul><button id="setup-enable" type="button">Enable sound &amp; microphone</button><button id="setup-finish" type="button" disabled>Ready</button><button id="setup-skip" type="button">Use without microphone</button><p id="setup-error" role="alert"></p></section>
<section id="preferences" class="pixel-panel" aria-label="Companion settings" hidden><h2>Companion settings</h2><p id="settings-notice" role="status"></p><label>Speaker volume <input id="speaker-volume" type="range" min="0" max="100" value="50"></label><div class="setting-actions"><button id="speaker-enable" type="button">Enable sound</button><button id="mic-mode" type="button">Use tap mode</button><button id="setup-reset" type="button">Review permissions</button></div><form id="name-form"><label>Screen name<input id="screen-name" maxlength="40" aria-label="Screen name" required></label><button>Save screen name</button></form><button id="settings-close" type="button">Done</button></section>
</main><video id="video" muted playsinline hidden></video><script>window.addEventListener('error',function(e){var n=document.getElementById('setup-error');if(n){n.textContent='Screen startup error: '+(e.message||('Could not load '+(e.target&&e.target.src||'screen assets')));var src=e.target&&e.target.src;if(src)fetch(src+'?diagnostic=1',{cache:'reload'}).then(function(r){n.textContent+=' · HTTP '+r.status+' · '+r.headers.get('content-type');}).catch(function(err){n.textContent+=' · '+err.message;});}},true);window.addEventListener('unhandledrejection',function(e){var n=document.getElementById('setup-error');if(n)n.textContent='Screen startup error: '+String(e.reason&&e.reason.message||e.reason);});</script><script src="/character-environments.js"></script><script src="/lab-room.js"></script><script src="/browser-audio.js"></script><script src="/companion-ui.js"></script><script src="/companion.js?mobile=4"></script></body></html>
